name: Gerar APK Android (Operador)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-operador-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Instalar dependências
        run: npm ci

      - name: Gerar frontend e sincronizar Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Compilar APK Operador
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleOperadorDebug --stacktrace --no-daemon 2>&1 | tee ../gradle-apk-build.log

      - name: Relatar falha do Gradle
        if: failure()
        run: |
          summary=$(grep -A 5 '^\* What went wrong:' gradle-apk-build.log | tr '\n' ' ' | cut -c1-180)
          echo "::error title=Falha ao compilar APK::${summary:-Consulte o log Gradle anexado.}"
          exit 1

      - name: Anexar log do Gradle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChamaAi-Operador-Gradle-log
          path: gradle-apk-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ChamaAi-Operador-1.0.174-debug
          path: android/app/build/outputs/apk/operador/debug/app-operador-debug.apk
          if-no-files-found: error
          retention-days: 30
